name: Open Signage Plus V2 CI

on:
  push:
    branches:
      - main
      - feat/open-signage-plus-v2-xibo
  pull_request:
    branches:
      - main
      - feat-refactor-digital-signage-app

permissions:
  contents: read

concurrency:
  group: open-signage-v2-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: npm ci
      - name: Apply compatible runtime security fixes
        run: npm audit fix --omit=dev
      - name: Audit backend runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - name: Validate installer shell syntax
        run: bash -n install.sh
      - name: Validate Docker Compose V2 stack
        run: |
          cp .env.example .env.ci
          docker compose --env-file .env.ci -f docker-compose.v2.yml config >/dev/null
      - name: Validate nginx config
        run: docker run --rm --add-host open-signage-api:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t
      - name: Build production backend image
        run: docker build -t open-signage-api-ci packages/backend
      - name: Smoke test production backend image
        run: |
          docker run -d --name open-signage-api-smoke \
            -e PORT=3000 \
            -e ADMIN_EMAIL=ci@example.invalid \
            -e ADMIN_PASSWORD='CI-Strong-Password-2026!' \
            -e SESSION_SECRET='ci-session-secret-0123456789abcdef0123456789abcdef' \
            -p 127.0.0.1:33000:3000 \
            open-signage-api-ci
          cleanup() { docker rm -f open-signage-api-smoke >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error http://127.0.0.1:33000/api/health | grep -q '"status":"ok"'; then
              exit 0
            fi
            sleep 1
          done
          docker logs open-signage-api-smoke
          exit 1
      - name: Build production web image
        run: docker build -f Dockerfile.web -t open-signage-web-ci .

  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify runner Chrome
        run: google-chrome --version
      - run: npx playwright test --project=chromium
