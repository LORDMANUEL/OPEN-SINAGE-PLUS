name: Open Signage Plus V2 CI

on:
  push:
    branches:
      - feat/open-signage-plus-v2-xibo
  pull_request:
    branches:
      - main
      - feat-refactor-digital-signage-app

concurrency:
  group: open-signage-v2-${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: npm ci
      - name: Audit backend runtime dependencies
        run: npm audit --omit=dev --audit-level=high
      - run: npm test

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Validate installer shell syntax
        run: bash -n install.sh
      - name: Validate Docker Compose V2 stack
        run: |
          cp .env.example .env.ci
          docker compose --env-file .env.ci -f docker-compose.v2.yml config >/dev/null
      - name: Validate nginx config
        run: docker run --rm --add-host open-signage-api:127.0.0.1 -v "$PWD/deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro" nginx:alpine nginx -t

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
