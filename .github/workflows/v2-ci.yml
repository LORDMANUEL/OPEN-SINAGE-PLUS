name: Open Signage Plus V2 CI

on:
  push:
    branches:
      - feat/open-signage-plus-v2-xibo
  pull_request:
    branches:
      - main
      - feat-refactor-digital-signage-app

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: packages/backend/package-lock.json
      - run: npm ci
      - run: npm test

  deployment:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate installer shell syntax
        run: bash -n install.sh
      - name: Validate Docker Compose V2 stack
        run: |
          cp .env.example .env.ci
          docker compose --env-file .env.ci -f docker-compose.v2.yml config >/dev/null

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --project=chromium
