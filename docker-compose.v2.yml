services:
  cms-db:
    image: mysql:8.4
    volumes:
      - ./shared/db:/var/lib/mysql:Z
    environment:
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_RANDOM_ROOT_PASSWORD: "yes"
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -ucms -p$${MYSQL_PASSWORD} --silent"]
      interval: 15s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  cms-xmr:
    image: ghcr.io/xibosignage/xibo-xmr:1.3
    ports:
      - "9505:9505"
    environment:
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
    restart: unless-stopped

  cms-memcached:
    image: memcached:alpine
    command: memcached -m 15
    restart: unless-stopped

  cms-quickchart:
    image: ianw/quickchart
    restart: unless-stopped

  cms-web:
    image: ghcr.io/xibosignage/xibo-cms:release-4.5.0
    depends_on:
      cms-db:
        condition: service_healthy
      cms-xmr:
        condition: service_started
      cms-memcached:
        condition: service_started
    volumes:
      - ./shared/cms/custom:/var/www/cms/custom:Z
      - ./shared/backup:/var/www/backup:Z
      - ./shared/cms/library:/var/www/cms/library:Z
      - ./shared/cms/web/userscripts:/var/www/cms/web/userscripts:Z
      - ./shared/cms/ca-certs:/var/www/cms/ca-certs:Z
    environment:
      MYSQL_HOST: cms-db
      MYSQL_DATABASE: cms
      MYSQL_USER: cms
      MYSQL_PASSWORD: ${MYSQL_PASSWORD}
      XMR_HOST: cms-xmr
      CMS_USE_MEMCACHED: "true"
      MEMCACHED_HOST: cms-memcached
      CMS_SERVER_NAME: ${CMS_SERVER_NAME:-localhost}
      CMS_QUICK_CHART_URL: http://cms-quickchart:3400
    ports:
      - "${XIBO_ADMIN_BIND:-127.0.0.1}:8081:80"
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    profiles: ["ai"]
    volumes:
      - ./shared/ollama:/root/.ollama
    restart: unless-stopped

  open-signage-api:
    build:
      context: ./packages/backend
    depends_on:
      cms-web:
        condition: service_started
      cms-quickchart:
        condition: service_started
    volumes:
      - ./shared/open-signage:/data
      - ./shared/backups:/backups:ro
    environment:
      PORT: 3000
      OPEN_SIGNAGE_DATA_DIR: /data
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      SESSION_TTL_SECONDS: ${SESSION_TTL_SECONDS:-28800}
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      TRUST_PROXY: ${TRUST_PROXY:-loopback, linklocal, uniquelocal}
      DOMAIN: ${DOMAIN:-}
      BACKUP_MONITOR_ROOT: /backups
      DISK_FREE_WARN_PERCENT: ${DISK_FREE_WARN_PERCENT:-10}
      BACKUP_MAX_AGE_HOURS: ${BACKUP_MAX_AGE_HOURS:-30}
      TLS_EXPIRY_WARN_DAYS: ${TLS_EXPIRY_WARN_DAYS:-21}
      XIBO_BASE_URL: ${XIBO_BASE_URL:-http://cms-web}
      XIBO_CLIENT_ID: ${XIBO_CLIENT_ID}
      XIBO_CLIENT_SECRET: ${XIBO_CLIENT_SECRET}
      XIBO_TIMEOUT_MS: ${XIBO_TIMEOUT_MS:-10000}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_TIMEOUT_MS: ${AI_TIMEOUT_MS:-60000}
      AI_FALLBACK_PROVIDER: ${AI_FALLBACK_PROVIDER:-}
      AI_FALLBACK_BASE_URL: ${AI_FALLBACK_BASE_URL:-}
      AI_FALLBACK_MODEL: ${AI_FALLBACK_MODEL:-}
      AI_FALLBACK_API_KEY: ${AI_FALLBACK_API_KEY:-}
      AI_FALLBACK_TIMEOUT_MS: ${AI_FALLBACK_TIMEOUT_MS:-60000}
      QUICKCHART_BASE_URL: ${QUICKCHART_BASE_URL:-http://cms-quickchart:3400}
      QR_TIMEOUT_MS: ${QR_TIMEOUT_MS:-10000}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-465}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_FROM: ${SMTP_FROM:-}
      ALERT_EMAIL_TO: ${ALERT_EMAIL_TO:-}
      MONITOR_INTERVAL_MS: ${MONITOR_INTERVAL_MS:-60000}
      ALERT_COOLDOWN_MS: ${ALERT_COOLDOWN_MS:-900000}
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  open-signage-web:
    build:
      context: .
      dockerfile: Dockerfile.web
    depends_on:
      open-signage-api:
        condition: service_healthy
    ports:
      - "${WEB_BIND:-0.0.0.0}:8080:80"
    restart: unless-stopped

networks:
  default:
    name: open-signage-plus-v2
